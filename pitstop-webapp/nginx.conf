server {
    listen 8080;
    server_name localhost;

    # Removes the nginx version from responses and error pages
    # (ZAP: In Page Banner Information Leak [10009])
    server_tokens off;

    add_header X-Content-Type-Options        "nosniff"                   always;
    add_header X-Frame-Options               "DENY"                      always;
    add_header Referrer-Policy               "no-referrer"               always;
    add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy    "same-origin"               always;
    add_header Cross-Origin-Embedder-Policy  "require-corp"              always;
    add_header Cross-Origin-Resource-Policy  "same-origin"               always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # SPA history-mode fallback: without this, deep links like
        # /vehicles 404 instead of loading the app.
        try_files $uri $uri/ /index.html;
    }
}

