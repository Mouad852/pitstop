stages:
  - security
  - build
  - scan
  - deploy

include:
  - project: 'pitstop-mouad-chaouni/pitstop-ci-templates'
    ref: main
    file:
      - '/rules.yml'
      - '/build.yml'
      - '/deploy.yml'
      - '/security.yml'

build-image:
  extends: .build-image

update-manifest:
  extends: .update-manifest
  variables:
    IMAGE_NAME: pitstop-vehicle
    MANIFEST_FILE: services/vehicle.yaml
    SERVICE_NAME: vehicle
