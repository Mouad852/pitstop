vulnerabilities:
  - id: CVE-2026-59873
    statement: >-
      node-tar is bundled inside npm in the node:24-alpine base image, not a
      dependency of this service. No published Node image ships the fixed
      7.5.19 yet. The vulnerability is a gzip-bomb denial of service that
      requires unpacking an attacker-supplied archive; this container never
      invokes tar at runtime. Re-evaluate when a patched base image exists.
    expired_at: 2026-11-30