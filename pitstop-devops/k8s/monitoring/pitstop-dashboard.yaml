# Grafana dashboard as code.
#
# The Grafana pod runs a sidecar that watches for ConfigMaps labelled
# grafana_dashboard="1" in its own namespace and loads them automatically,
# which is why this lives in `monitoring` rather than `pitstop`.
#
# Safe for Argo to manage despite prune:true — a ConfigMap ships no CRDs, so
# the hazard that keeps the kube-prometheus-stack chart out of GitOps does not
# apply. Worst case a dashboard disappears and returns on the next sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pitstop
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pitstop-overview.json: |
    {
      "uid": "pitstop-overview",
      "title": "Pitstop / Overview",
      "description": "Consolidated view of the pitstop namespace: workload health from kube-state-metrics, resource usage from cAdvisor, node context from node-exporter.\n\nPORTABILITY: the resource panels aggregate pod-level cAdvisor series, because this cluster runtime leaves the container and image labels empty. On a containerd cluster both pod-level and container-level series exist and these sums would double-count. Add container!=\"\" to those selectors there.",
      "tags": [
        "pitstop"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "DS",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS}"
            },
            "query": "label_values(kube_pod_info, namespace)",
            "current": {
              "text": "pitstop",
              "value": "pitstop"
            },
            "refresh": 1,
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods running",
          "description": "Pods in the Running phase. Compare against Pods not ready.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_phase{namespace=\"$namespace\",phase=\"Running\"} == 1)",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods not ready",
          "description": "Running is not Ready. A pod counted here has started but is failing its readiness probe, so Services exclude it from their endpoints and it receives no traffic.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_ready{namespace=\"$namespace\",condition=\"true\"} == 0) or vector(0)",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Restarts (last 1h)",
          "description": "Container restarts across the namespace in the last hour. Sustained growth here is the signature of a crash loop.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h])) or vector(0)",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Node memory used",
          "description": "Whole-node memory pressure, from node-exporter. Context for everything below: pod limits mean little once the node itself is full.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU by pod (cores)",
          "description": "Pod-level cAdvisor metrics. This cluster runtime does not populate the container/image labels, so per-container series are unavailable. Harmless here, since every pod runs a single container.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory working set by pod",
          "description": "Working set is the memory the kernel cannot reclaim under pressure. This is what the OOM killer acts on, not RSS.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU throttling by pod",
          "description": "Share of CPU scheduling periods in which the kernel throttled the pod for hitting its CPU limit. Sustained throttling means the limit is too low: the pod is slow, but nothing crashes and no other panel shows it.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"$namespace\"}[5m])), 1)",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Disk I/O by pod",
          "description": "Container filesystem throughput. Network metrics are unavailable on this runtime, so this is the I/O signal that does work.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_fs_writes_bytes_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{pod}} write",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (rate(container_fs_reads_bytes_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{pod}} read",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "Deployment replicas",
          "description": "Desired versus ready, from kube-state-metrics. A persistent gap is a deployment that never converged.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "instance": true,
                  "service": true,
                  "endpoint": true,
                  "container": true,
                  "namespace": true,
                  "uid": true,
                  "__name__": true,
                  "pod": true
                },
                "renameByName": {
                  "Value #A": "desired",
                  "Value #B": "ready"
                }
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_spec_replicas{namespace=\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "desired",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            },
            {
              "refId": "B",
              "expr": "kube_deployment_status_replicas_ready{namespace=\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "ready",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "table",
          "title": "Container restarts by pod",
          "description": "Cumulative restarts since each pod was created.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "instance": true,
                  "service": true,
                  "endpoint": true,
                  "container": true,
                  "namespace": true,
                  "uid": true,
                  "__name__": true
                },
                "renameByName": {
                  "Value": "restarts"
                }
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"$namespace\"})",
              "instant": true,
              "format": "table",
              "legendFormat": "restarts",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              }
            }
          ]
        }
      ]
    }
