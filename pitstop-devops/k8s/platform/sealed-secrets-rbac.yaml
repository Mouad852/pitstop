# namespaces:get is cluster-scoped and cannot come from a RoleBinding.
# This is the only cluster-wide grant the controller keeps: read-only
# namespace metadata, no access to any object inside them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-namespace-reader
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: sealed-secrets-namespace-reader
  apiGroup: rbac.authorization.k8s.io
---
# A RoleBinding may reference a ClusterRole: the rules apply, but only
# within this namespace. Reuses the upstream role, no rule duplication.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-unsealer
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: secrets-unsealer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-unsealer
  namespace: pitstop
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: secrets-unsealer
  apiGroup: rbac.authorization.k8s.io
