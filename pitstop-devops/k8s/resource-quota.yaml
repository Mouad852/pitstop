apiVersion: v1
kind: ResourceQuota
metadata:
  name: pitstop-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 5Gi
    limits.cpu: "12"
    limits.memory: 12Gi
    pods: "30"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pitstop-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
