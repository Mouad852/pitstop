apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-config
data:
  SERVICE_NAME: pitstop-workshop
  PORT: "3003"
  PROD_DB_HOSTNAME: mysql-workshop
  PROD_DB_PORT: "3306"
  MESSAGE_BUS: rabbitmq
  MESSAGE_BUS_TIMEOUT: "500"
---
apiVersion: v1
kind: Service
metadata:
  name: workshop
spec:
  type: ClusterIP
  selector:
    app: workshop
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workshop
  template:
    metadata:
      labels:
        app: workshop
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: workshop
          image: registry.gitlab.com/pitstop-mouad-chaouni/pitstop-workshop:e88cc03f
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: workshop-config
          env:
            - name: PROD_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-workshop-credentials
                  key: MYSQL_USER
            - name: PROD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-workshop-credentials
                  key: MYSQL_PASSWORD
            - name: PROD_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-workshop-credentials
                  key: MYSQL_DATABASE
            - name: MESSAGE_BUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_USER
            - name: MESSAGE_BUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/workshop/ping
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/workshop/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/workshop/ping
              port: http
            periodSeconds: 20
      automountServiceAccountToken: false
