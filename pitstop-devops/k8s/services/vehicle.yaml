apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-config
data:
  SERVICE_NAME: pitstop-vehicle
  PORT: "3002"
  PROD_DB_HOSTNAME: mysql-vehicle
  PROD_DB_PORT: "3306"
  MESSAGE_BUS: rabbitmq
  MESSAGE_BUS_TIMEOUT: "500"
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle
spec:
  type: ClusterIP
  selector:
    app: vehicle
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle
  template:
    metadata:
      labels:
        app: vehicle
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: vehicle
          image: registry.gitlab.com/pitstop-mouad-chaouni/pitstop-vehicle:9a2127b8
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: vehicle-config
          env:
            - name: PROD_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-vehicle-credentials
                  key: MYSQL_USER
            - name: PROD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-vehicle-credentials
                  key: MYSQL_PASSWORD
            - name: PROD_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-vehicle-credentials
                  key: MYSQL_DATABASE
            - name: MESSAGE_BUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_USER
            - name: MESSAGE_BUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/vehicles/ping
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/vehicles/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/vehicles/ping
              port: http
            periodSeconds: 20
      automountServiceAccountToken: false
