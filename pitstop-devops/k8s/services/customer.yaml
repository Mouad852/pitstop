apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-config
data:
  SERVICE_NAME: pitstop-customer
  PORT: "3001"
  PROD_DB_HOSTNAME: mysql-customer
  PROD_DB_PORT: "3306"
  MESSAGE_BUS: rabbitmq
  MESSAGE_BUS_TIMEOUT: "500"
---
apiVersion: v1
kind: Service
metadata:
  name: customer
spec:
  type: ClusterIP
  selector:
    app: customer
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: customer
          image: registry.gitlab.com/pitstop-mouad-chaouni/pitstop-customer:8a2a3c18
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: customer-config
          env:
            - name: PROD_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-customer-credentials
                  key: MYSQL_USER
            - name: PROD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-customer-credentials
                  key: MYSQL_PASSWORD
            - name: PROD_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-customer-credentials
                  key: MYSQL_DATABASE
            - name: MESSAGE_BUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_USER
            - name: MESSAGE_BUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/customers/ping
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/customers/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/customers/ping
              port: http
            periodSeconds: 20
      automountServiceAccountToken: false
