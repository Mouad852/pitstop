apiVersion: v1
kind: ServiceAccount
metadata:
  name: pitstop-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pitstop-viewer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pitstop-viewer
subjects:
  - kind: ServiceAccount
    name: pitstop-viewer
    namespace: pitstop
roleRef:
  kind: Role
  name: pitstop-viewer
  apiGroup: rbac.authorization.k8s.io
